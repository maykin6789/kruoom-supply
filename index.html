<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#165a8a">
<title>KRUOOM | ระบบเบิกพัสดุ</title>
<style>
:root{--blue:#165a8a;--blue2:#287db2;--bg:#f4f7fa;--card:#fff;--text:#183247;--muted:#71808d;--line:#e4ebf1;--green:#15945a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;min-height:100vh}.header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:22px 18px 18px;box-shadow:0 3px 15px #123b5525}
.brand{font-size:28px;font-weight:900;letter-spacing:.5px}.subtitle{opacity:.9;font-size:14px;margin-top:2px}
.search{margin-top:16px;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 14px;box-shadow:0 3px 12px #123b5520}.search span{font-size:20px}.search input{border:0;outline:0;width:100%;padding:13px 10px;color:var(--text);background:transparent}
.content{padding:18px}.section-title{font-size:18px;font-weight:800;margin:4px 0 12px}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 2px 8px #1832470b;transition:.15s}.cat:hover{transform:translateY(-1px);box-shadow:0 5px 15px #18324714}
.cat .icon{font-size:26px}.cat .name{font-weight:800;margin-top:7px}.cat .count{font-size:12px;color:var(--muted);margin-top:3px}
.back{display:none;border:0;background:#fff;border-radius:12px;padding:9px 13px;margin-bottom:12px;cursor:pointer;color:var(--blue);font-weight:800}
.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;align-items:center;gap:12px}
.item-main{flex:1;min-width:0}.item-name{font-weight:750;line-height:1.35}.item-code{font-size:11px;color:var(--muted);margin-top:4px}.item-cat{font-size:11px;color:var(--blue);margin-top:3px}
.req{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:35px 10px}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0b1e2d88;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 24px;max-height:92vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sheet h2{margin:0;font-size:21px}.close{border:0;background:#eef3f7;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px}
.field{margin-top:15px}.label{font-size:13px;font-weight:800;margin-bottom:7px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:750;cursor:pointer}.choice button.active{border:2px solid var(--blue);background:#eef7fd;color:var(--blue)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#f5f7f9;font-size:22px;cursor:pointer}.qty input{width:80px;text-align:center;height:42px;border:1px solid var(--line);border-radius:12px;outline:none}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.confirm{width:100%;margin-top:20px;border:0;border-radius:13px;background:var(--green);color:#fff;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.receipt{padding:12px 2px 4px}.ok{width:54px;height:54px;border-radius:50%;background:#e6f8ef;color:var(--green);display:grid;place-items:center;font-size:30px;margin:2px auto 10px}.receipt h2{text-align:center;margin:0}.receipt-sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 15px}
.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px dashed #d7e0e7;padding:10px 0;font-size:14px}.row b{text-align:right}.done{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:14px;font-weight:900;margin-top:18px;cursor:pointer}.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}
@media(min-width:650px){.categories{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<header class="header">
<div class="brand">KRUOOM</div><div class="subtitle">ระบบเบิกพัสดุออนไลน์</div>

<section id="itemsSection" class="hidden"><div class="section-title" id="listTitle">รายการพัสดุ</div><div class="list" id="items"></div></section>
<div class="note">ระบบเบิกพัสดุใช้แล้วหมดไป<br>Develop by Mekin</div>
</main></div>
<div class="overlay hidden" id="overlay"><div class="sheet" id="sheet"></div></div>

        <button class="done" onclick="closeModal()">เสร็จสิ้น</button>
        <div class="note">บันทึกข้อมูลลง Excel แล้ว • แถวที่ ${result.excelRow}</div>
      </div>`;

  }catch(error){
    console.error(error);

    sheet.innerHTML=`
      <div class="receipt">
        <div class="ok" style="background:#fff0f0;color:#c62828">!</div>
        <h2>บันทึกไม่สำเร็จ</h2>
        <div class="receipt-sub">${esc(error.message)}</div>
        <button class="done" onclick="renderForm()">ลองใหม่</button>
      </div>`;
  }
}
function closeModal(){overlay.classList.add("hidden")}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal()});
backBtn.onclick=()=>{currentCategory=null;home.classList.remove("hidden");itemsSection.classList.add("hidden");backBtn.style.display="none";search.value="";renderCategories()};
search.addEventListener("input",()=>{
if(currentCategory)renderItems();else{const q=search.value.trim().toLowerCase();if(q){home.classList.add("hidden");itemsSection.classList.remove("hidden");backBtn.style.display="block";$("listTitle").textContent="ผลการค้นหา";renderItemsAll(q)}else{home.classList.remove("hidden");itemsSection.classList.add("hidden");backBtn.style.display="none"}}
});
renderCategories();
</script>
</body>
</html>
